<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">LiveRadar 网站美术风格定义</title>
  <desc id="desc">一张横向风格板，概括 LiveRadar 的视觉语言、色彩、材质、组件、动效和平台符号。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050607"/>
      <stop offset="42%" stop-color="#080b0d"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0.18" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#22ffb0" stop-opacity="0.34"/>
      <stop offset="62%" stop-color="#22ffb0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22ffb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="0.72" cy="0.34" r="0.65">
      <stop offset="0%" stop-color="#ff7a38" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ff7a38" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff7a38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15191b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#07090a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="warmPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a211a" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#111719" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#07090a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5d23"/>
      <stop offset="100%" stop-color="#ffb36d"/>
    </linearGradient>
    <linearGradient id="cyanGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d0ff"/>
      <stop offset="100%" stop-color="#39f6a6"/>
    </linearGradient>
    <linearGradient id="liveCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a1d"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="chipGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; }
      .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
      .title { fill: #f5f7fa; font-size: 58px; font-weight: 900; letter-spacing: 0; }
      .subtitle { fill: #9ca8b7; font-size: 23px; font-weight: 500; letter-spacing: 0; }
      .section { fill: #f2f6f7; font-size: 26px; font-weight: 850; letter-spacing: 0; }
      .body { fill: #c7d0dc; font-size: 20px; font-weight: 500; letter-spacing: 0; }
      .muted { fill: #7f8a99; font-size: 16px; font-weight: 500; letter-spacing: 0; }
      .tag { fill: #101418; font-size: 17px; font-weight: 800; letter-spacing: 0; }
      .number { fill: #2dffb2; font-size: 36px; font-weight: 900; }
      .line { stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1; }
      .card { fill: url(#panel); stroke: #ffffff; stroke-opacity: 0.12; stroke-width: 1.3; rx: 22; }
      .glass { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.12); stroke-width: 1.2; }
      .smallcap { fill: #96a1ae; font-size: 14px; font-weight: 850; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#greenGlow)"/>
  <rect width="1920" height="1080" fill="url(#orangeGlow)"/>

  <g opacity="0.72">
    <circle cx="104" cy="112" r="3" fill="#2dffb2"/>
    <circle cx="1716" cy="126" r="3" fill="#ff7a38"/>
    <circle cx="1810" cy="900" r="2.5" fill="#58d0ff"/>
    <circle cx="920" cy="72" r="2" fill="#b875ff"/>
  </g>

  <g transform="translate(92 72)">
    <g transform="translate(0 0)">
      <circle cx="42" cy="42" r="36" fill="#050607" stroke="#26313a" stroke-width="2"/>
      <circle cx="42" cy="42" r="23" fill="none" stroke="#2dffb2" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="18 9"/>
      <circle cx="42" cy="42" r="9" fill="#ff5d23" filter="url(#chipGlow)"/>
      <circle cx="70" cy="22" r="5" fill="#f0f5ff"/>
      <circle cx="25" cy="69" r="4" fill="#ff3d5a"/>
    </g>
    <text x="104" y="44" class="cn title">LiveRadar 美术风格定义</text>
    <text x="108" y="82" class="cn subtitle">暗色监控室 · 霓虹状态信号 · 玻璃拟态面板 · 低多边形平台符号 · 数据仪表节奏</text>
  </g>

  <g transform="translate(1318 84)">
    <rect x="0" y="0" width="436" height="74" rx="18" fill="#07090a" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="34" cy="37" r="7" fill="#2dffb2" filter="url(#chipGlow)"/>
    <text x="56" y="33" class="cn smallcap">ART DIRECTION</text>
    <text x="56" y="57" class="cn body">实时直播状态的桌面级监控界面</text>
  </g>

  <g filter="url(#softShadow)">
    <g transform="translate(96 190)">
      <rect class="card" width="520" height="360"/>
      <text x="32" y="50" class="cn section">01 视觉基调</text>
      <text x="32" y="90" class="cn body">像一间低照度直播监控室：信息密度高，</text>
      <text x="32" y="122" class="cn body">但层级冷静，不做营销式大块装饰。</text>
      <g transform="translate(32 158)">
        <rect width="456" height="64" rx="13" fill="#050708" stroke="#ffffff" stroke-opacity="0.1"/>
        <circle cx="30" cy="32" r="8" fill="#2dffb2" filter="url(#chipGlow)"/>
        <text x="54" y="28" class="cn body">实时状态优先</text>
        <text x="54" y="51" class="cn muted">Live / Offline / 最爱直播中 形成第一眼信号</text>
      </g>
      <g transform="translate(32 238)">
        <rect width="138" height="52" rx="12" fill="#101419" stroke="#2dffb2" stroke-opacity="0.38"/>
        <text x="22" y="33" class="cn body" fill="#2dffb2">LIVE NOW</text>
        <rect x="158" width="138" height="52" rx="12" fill="#101419" stroke="#ff7a38" stroke-opacity="0.38"/>
        <text x="188" y="33" class="cn body" fill="#ff9b5d">平台</text>
        <rect x="316" width="140" height="52" rx="12" fill="#101419" stroke="#8c95a3" stroke-opacity="0.28"/>
        <text x="354" y="33" class="cn body" fill="#aab3bf">离线</text>
      </g>
      <text x="32" y="330" class="cn muted">关键词：暗场、扫描线、微光、仪表、秩序感</text>
    </g>

    <g transform="translate(650 190)">
      <rect class="card" width="540" height="360"/>
      <text x="32" y="50" class="cn section">02 色彩系统</text>
      <text x="32" y="90" class="cn body">大面积近黑背景，少量高饱和色只用于状态、</text>
      <text x="32" y="122" class="cn body">平台识别和正在播放等关键反馈。</text>
      <g transform="translate(32 164)">
        <g transform="translate(0 0)">
          <rect width="76" height="76" rx="16" fill="#050607" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="0" y="106" class="mono muted">#050607</text>
          <text x="0" y="130" class="cn muted">主背景</text>
        </g>
        <g transform="translate(112 0)">
          <rect width="76" height="76" rx="16" fill="#15191b" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="0" y="106" class="mono muted">#15191B</text>
          <text x="0" y="130" class="cn muted">玻璃面板</text>
        </g>
        <g transform="translate(224 0)">
          <rect width="76" height="76" rx="16" fill="#2dffb2" filter="url(#chipGlow)"/>
          <text x="0" y="106" class="mono muted">#2DFFB2</text>
          <text x="0" y="130" class="cn muted">直播状态</text>
        </g>
        <g transform="translate(336 0)">
          <rect width="76" height="76" rx="16" fill="#ff5d23" filter="url(#chipGlow)"/>
          <text x="0" y="106" class="mono muted">#FF5D23</text>
          <text x="0" y="130" class="cn muted">斗鱼/播放</text>
        </g>
        <g transform="translate(448 0)">
          <rect width="40" height="76" rx="16" fill="#8d5cf6"/>
          <rect x="46" width="40" height="76" rx="16" fill="#58d0ff"/>
          <text x="0" y="106" class="mono muted">紫 / 青</text>
          <text x="0" y="130" class="cn muted">平台辅助色</text>
        </g>
      </g>
      <path d="M32 324H508" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="32" y="340" class="cn muted">原则：背景克制，状态强烈；颜色必须说明“此刻发生了什么”。</text>
    </g>

    <g transform="translate(1224 190)">
      <rect class="card" width="600" height="360"/>
      <text x="32" y="50" class="cn section">03 材质与空间</text>
      <text x="32" y="90" class="cn body">黑色玻璃、细描边、内发光、轻微模糊背景。</text>
      <text x="32" y="122" class="cn body">面板像悬浮在网格空间中，但不脱离工具属性。</text>
      <g transform="translate(34 158)">
        <rect width="236" height="126" rx="18" fill="#0b0f12" stroke="#ffffff" stroke-opacity="0.13"/>
        <rect x="18" y="18" width="200" height="34" rx="10" fill="#ffffff" fill-opacity="0.045"/>
        <rect x="18" y="68" width="150" height="16" rx="8" fill="#2dffb2" fill-opacity="0.86"/>
        <rect x="18" y="94" width="198" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      </g>
      <g transform="translate(316 158)">
        <rect width="220" height="126" rx="18" fill="url(#warmPanel)" stroke="#ffb36d" stroke-opacity="0.22"/>
        <circle cx="48" cy="63" r="31" fill="#050607" stroke="#ff7a38" stroke-width="5"/>
        <circle cx="48" cy="63" r="19" fill="url(#orange)"/>
        <path d="M104 42H190" stroke="#f4f7fa" stroke-width="8" stroke-linecap="round"/>
        <path d="M104 70H166" stroke="#98a4b3" stroke-width="6" stroke-linecap="round"/>
        <circle cx="184" cy="86" r="15" fill="#ff7a38" fill-opacity="0.26" stroke="#ffb36d" stroke-opacity="0.4"/>
      </g>
      <text x="34" y="328" class="cn muted">面板半径控制在 8-22px；细边框、轻阴影、低亮度玻璃。</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <g transform="translate(96 588)">
      <rect class="card" width="560" height="386"/>
      <text x="32" y="50" class="cn section">04 核心组件语言</text>
      <text x="32" y="88" class="cn body">卡片、状态条、平台选择、音乐播放器都遵循同一规则：</text>
      <text x="32" y="118" class="cn body">边界清楚、信息可扫、行动按钮紧凑。</text>
      <g transform="translate(32 154)">
        <rect width="228" height="164" rx="14" fill="url(#liveCard)" stroke="#ffffff" stroke-opacity="0.13"/>
        <rect x="0" y="0" width="228" height="86" rx="14" fill="#1a1f22"/>
        <path d="M0 86H228" stroke="#000000" stroke-opacity="0.45"/>
        <rect x="14" y="14" width="50" height="25" rx="7" fill="#ff6f34"/>
        <text x="25" y="32" class="cn tag" fill="#fff">斗鱼</text>
        <rect x="152" y="14" width="62" height="25" rx="8" fill="#0c241b" stroke="#2dffb2" stroke-opacity="0.45"/>
        <circle cx="166" cy="27" r="4" fill="#2dffb2"/>
        <text x="176" y="32" class="cn muted" fill="#2dffb2">直播中</text>
        <circle cx="30" cy="124" r="23" fill="#101417" stroke="#2dffb2" stroke-opacity="0.5"/>
        <text x="66" y="119" class="cn body" fill="#f5f7fa">主播卡片</text>
        <text x="66" y="145" class="cn muted">封面 / 状态 / 操作</text>
      </g>
      <g transform="translate(296 154)">
        <rect width="228" height="164" rx="14" fill="#080a0c" stroke="#ffffff" stroke-opacity="0.13"/>
        <rect x="18" y="18" width="192" height="36" rx="10" fill="#11161a" stroke="#ffffff" stroke-opacity="0.11"/>
        <circle cx="36" cy="36" r="5" fill="#ff6f34"/>
        <text x="54" y="43" class="cn body">平台选择器</text>
        <rect x="18" y="76" width="192" height="44" rx="10" fill="#050607" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="36" y="104" class="cn muted">输入房间号...</text>
        <rect x="146" y="132" width="64" height="22" rx="7" fill="#15191b" stroke="#2dffb2" stroke-opacity="0.4"/>
        <text x="157" y="148" class="mono muted" fill="#2dffb2">2/3</text>
      </g>
      <text x="32" y="354" class="cn muted">布局偏工作台：窄边框、状态徽标、紧凑操作区、明确 hover/focus。</text>
    </g>

    <g transform="translate(690 588)">
      <rect class="card" width="540" height="386"/>
      <text x="32" y="50" class="cn section">05 平台符号与环境效果</text>
      <text x="32" y="88" class="cn body">雪花不是普通白点，而是平台 logo 的低多边形碎片。</text>
      <text x="32" y="118" class="cn body">随机旋转、透明度变化，营造直播平台宇宙感。</text>
      <g transform="translate(45 162)">
        <g transform="translate(0 0) rotate(-8 45 45)">
          <polygon points="20,18 74,14 88,52 55,86 15,62" fill="#ff7a38"/>
          <polygon points="33,32 64,30 70,54 48,70 29,55" fill="#101418" opacity="0.82"/>
          <text x="20" y="124" class="cn body">斗鱼橙</text>
        </g>
        <g transform="translate(135 0) rotate(10 45 45)" opacity="0.82">
          <polygon points="18,30 72,18 88,56 61,86 22,78" fill="#ff7ab8"/>
          <polygon points="36,42 45,50 54,42 62,50 45,68 28,50" fill="#101418" opacity="0.8"/>
          <text x="20" y="124" class="cn body">B站粉</text>
        </g>
        <g transform="translate(270 0) rotate(-18 45 45)" opacity="0.7">
          <polygon points="18,16 86,22 75,80 30,88 14,46" fill="#8d5cf6"/>
          <polygon points="39,34 66,34 66,55 54,55 46,68 46,55 39,55" fill="#101418" opacity="0.82"/>
          <text x="14" y="124" class="cn body">Twitch 紫</text>
        </g>
        <g transform="translate(405 0) rotate(14 45 45)" opacity="0.88">
          <polygon points="20,20 74,16 84,72 42,88 14,54" fill="#53fc18"/>
          <polygon points="35,30 50,30 50,46 67,30 80,30 61,51 82,76 66,76 50,55 50,76 35,76" fill="#101418" opacity="0.82"/>
          <text x="24" y="124" class="cn body">Kick 绿</text>
        </g>
      </g>
      <text x="32" y="354" class="cn muted">效果规则：纯代码、轻量、低密度、可降级，优先不影响监控性能。</text>
    </g>

    <g transform="translate(1264 588)">
      <rect class="card" width="560" height="386"/>
      <text x="32" y="50" class="cn section">06 动效与反馈</text>
      <text x="32" y="88" class="cn body">动效不炫技，服务状态理解：直播脉冲、刷新节奏、</text>
      <text x="32" y="118" class="cn body">音乐播放、加载和错误都必须一眼可读。</text>
      <g transform="translate(36 158)">
        <rect width="220" height="126" rx="18" fill="#080b0d" stroke="#ffffff" stroke-opacity="0.13"/>
        <circle cx="42" cy="42" r="8" fill="#2dffb2" filter="url(#chipGlow)"/>
        <text x="66" y="49" class="cn body">直播脉冲</text>
        <rect x="28" y="75" width="164" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
        <rect x="28" y="75" width="116" height="12" rx="6" fill="url(#cyanGreen)"/>
        <text x="28" y="108" class="mono muted">0.9s refresh rhythm</text>
      </g>
      <g transform="translate(292 158)">
        <rect width="220" height="126" rx="18" fill="url(#warmPanel)" stroke="#ffb36d" stroke-opacity="0.22"/>
        <circle cx="45" cy="64" r="28" fill="#050607"/>
        <circle cx="45" cy="64" r="20" fill="url(#orange)"/>
        <path d="M104 86V54" stroke="#ff8a43" stroke-width="7" stroke-linecap="round"/>
        <path d="M123 86V38" stroke="#ffd483" stroke-width="7" stroke-linecap="round"/>
        <path d="M142 86V66" stroke="#ff5d23" stroke-width="7" stroke-linecap="round"/>
        <text x="92" y="112" class="cn muted">播放均衡条</text>
      </g>
      <g transform="translate(36 318)">
        <rect width="488" height="38" rx="12" fill="#101418" stroke="#ffffff" stroke-opacity="0.11"/>
        <text x="18" y="25" class="cn muted">反馈层级：即时状态 class → 轻动画 → 可读文字 → 不阻塞主操作</text>
      </g>
    </g>
  </g>

  <g transform="translate(96 1008)">
    <path d="M0 0H1728" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="0" y="34" class="cn muted">Design DNA：黑场监控 / 玻璃仪表 / 霓虹状态 / 平台低多边形 / 紧凑工具感 / 轻量代码动效</text>
    <text x="1420" y="34" class="mono muted">LiveRadar · Style Board</text>
  </g>
</svg>
